name: Apply handwriting fix 1.0.31
on:
  push:
    branches: [main]
    paths: [release-patches/1.0.31.patch.gz.b64]
permissions:
  contents: write
jobs:
  apply-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply reviewed local patch
        run: |
          base64 -d release-patches/1.0.31.patch.gz.b64 | gzip -d > /tmp/handwriting-fix.patch
          git apply --check /tmp/handwriting-fix.patch
          git apply /tmp/handwriting-fix.patch
          git rm release-patches/1.0.31.patch.gz.b64 .github/workflows/apply-1.0.31.yml
          git add manifest.json package.json package-lock.json versions.json src/drawing-canvas.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Keep S Pen eraser armed through transient hover mask loss'
          git push origin HEAD:main
      - run: npm ci
      - run: npm run build
      - name: Publish 1.0.31
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create 1.0.31 main.js manifest.json styles.css --target "$(git rev-parse HEAD)" --generate-notes
